<!doctype html>
<!-- Generated by figure-gallery; edit figures.legends.toml and rebuild. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>@@GALLERY_TITLE@@ · Figures</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #ffffff;
      --ink: #1f2e35;
      --quiet: #637079;
      --line: #dfe5e7;
      --wash: #f5f8f8;
      --teal: #176b65;
      --teal-wash: #eaf4f1;
      font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--paper);
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    button, input, a { -webkit-tap-highlight-color: transparent; }
    button, input { font: inherit; }
    button, a { touch-action: manipulation; }
    button { cursor: pointer; }
    a { color: var(--teal); }
    :focus-visible { outline: 2px solid var(--teal); outline-offset: 3px; }
    [hidden] { display: none !important; }
    .shell { max-width: 1520px; margin: auto; padding: 32px 36px; }
    .masthead { display: flex; justify-content: space-between; gap: 24px; align-items: end;
      padding-bottom: 26px; margin-bottom: 28px; border-bottom: 1px solid var(--line); }
    .eyebrow { margin: 0 0 7px; color: var(--teal); font-size: 11px; font-weight: 700;
      letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 0; font-size: 27px; line-height: 1.25; font-weight: 650; letter-spacing: -.04em; }
    .intro { color: var(--quiet); margin: 9px 0 0; max-width: 680px; }
    .totals { margin: 0; color: var(--quiet); font-size: 12px; white-space: nowrap; }
    .layout { display: grid; grid-template-columns: 255px minmax(0, 1fr); gap: 36px; align-items: start; }
    .sidebar { position: sticky; top: 24px; max-height: 900px; overflow-y: auto; padding: 2px 4px 12px 0; }
    .search-label { display: block; margin-bottom: 8px; font-size: 12px; font-weight: 650; }
    .search { width: 100%; border: 1px solid var(--line); border-radius: 7px; padding: 9px 11px;
      color: var(--ink); background: var(--paper); margin-bottom: 20px; }
    .search::placeholder { color: #89939a; }
    details { margin-bottom: 13px; }
    summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: 9px;
      padding: 5px 2px; font-size: 12px; font-weight: 650; }
    summary::-webkit-details-marker { display: none; }
    summary::before { content: "›"; color: var(--quiet); transform: rotate(0deg); font-size: 17px;
      line-height: 1; width: 9px; }
    details[open] > summary::before { transform: rotate(90deg); }
    .section-count { margin-left: auto; font-weight: 400; color: var(--quiet); font-size: 11px; }
    .plot-list { display: grid; gap: 3px; padding: 5px 0 0 17px; }
    .plot-link { text-decoration: none; border-left: 2px solid transparent; border-radius: 0 5px 5px 0;
      display: block; padding: 7px 9px; color: var(--quiet); font-size: 12px; line-height: 1.45; }
    .plot-link:hover { background: var(--wash); color: var(--ink); }
    .plot-link[aria-current="true"] { color: var(--teal); border-color: var(--teal);
      background: var(--teal-wash); font-weight: 600; }
    .text-link { display: flex; gap: 9px; margin: 3px 0 13px; padding: 9px 8px;
      font-weight: 650; color: var(--ink); }
    .no-results { color: var(--quiet); font-size: 12px; }
    .section-heading { padding-bottom: 22px; }
    .section-heading .eyebrow { color: var(--quiet); letter-spacing: .1em; margin-bottom: 6px; }
    h2 { font-size: 22px; font-weight: 650; line-height: 1.3; letter-spacing: -.025em; margin: 0 0 10px; }
    .legend { max-width: 850px; color: var(--quiet); }
    .legend p { margin: 0 0 9px; }
    .legend p:last-child { margin-bottom: 0; }
    .text-content { max-width: 850px; border-top: 1px solid var(--line); padding-top: 22px;
      line-height: 1.75; }
    .text-content p { margin: 0 0 18px; }
    .text-content .text-source { margin: 24px 0 0; padding-top: 16px;
      border-top: 1px solid var(--line); font-size: 12px; }
    .figure-heading { border-top: 1px solid var(--line); padding-top: 20px; }
    .figure-number { font-size: 11px; color: var(--quiet); margin: 0 0 5px; }
    h3 { font-size: 17px; line-height: 1.4; letter-spacing: -.015em; font-weight: 650; margin: 0; }
    .plot-description { margin: 8px 0 0; color: var(--quiet); }
    .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 16px 0 12px; }
    .button { display: inline-flex; justify-content: center; align-items: center; gap: 6px;
      min-height: 34px; border: 1px solid var(--line); border-radius: 6px; padding: 6px 11px;
      font: 12px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-decoration: none; color: var(--ink); background: var(--paper); white-space: nowrap; }
    .button:hover { background: var(--wash); border-color: #bdccce; }
    .button:disabled { opacity: .38; cursor: default; }
    .pager { display: flex; gap: 5px; }
    .pager .button { width: 34px; font-size: 16px; padding: 4px; }
    .downloads { display: flex; gap: 6px; margin-left: auto; }
    .stage { border: 1px solid var(--line); border-radius: 8px; background: white;
      max-height: 820px; overflow: auto; min-height: 120px; }
    .stage img { display: block; width: 100%; height: auto; }
    .stage.is-zoomed img { width: max(100%, 1600px); max-width: none; }
    .image-status { padding: 24px; color: var(--quiet); }
    .download-panel { display: grid; justify-items: center; gap: 16px; padding: 58px 24px;
      border: 1px solid var(--line); border-radius: 8px; background: var(--wash); }
    .document-icon { width: 35px; height: 43px; color: var(--teal); }
    .download-note { color: var(--quiet); margin: 0; font-size: 13px; text-align: center; }
    .primary { background: var(--teal); border-color: var(--teal); color: white; padding: 8px 16px; }
    .primary:hover { color: white; background: #115850; border-color: #115850; }
    .view-hint { color: var(--quiet); font-size: 11px; margin: 10px 0 0; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    @media (max-width: 1000px) {
      .shell { padding: 26px 24px; }
      .layout { grid-template-columns: 215px minmax(0, 1fr); gap: 24px; }
      .masthead { align-items: start; }
    }
    @media (max-width: 700px) {
      .shell { padding: 22px 16px; }
      .masthead { display: block; margin-bottom: 20px; padding-bottom: 20px; }
      h1 { font-size: 24px; }
      .totals { margin-top: 12px; }
      .layout { grid-template-columns: minmax(0, 1fr); gap: 22px; }
      .sidebar { position: static; max-height: 310px; padding-right: 5px; border-bottom: 1px solid var(--line); }
      .search { margin-bottom: 12px; }
      .section-heading { padding-bottom: 18px; }
      h2 { font-size: 20px; }
      .stage { max-height: 650px; }
    }
    @media (prefers-reduced-motion: no-preference) {
      .button, .plot-link { transition: background-color .12s ease; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="masthead">
      <div>
        <p class="eyebrow">Figure library</p>
        <h1>@@GALLERY_TITLE@@</h1>
        <p class="intro">@@GALLERY_DESCRIPTION@@</p>
      </div>
      <p class="totals" id="totals"></p>
    </header>
    <div class="layout">
      <aside class="sidebar" aria-label="Figure navigation">
        <label class="search-label" for="search">Browse library</label>
        <input class="search" id="search" type="search" placeholder="Search figures and notes…" autocomplete="off">
        <nav id="navigation" aria-label="Sections and plots"></nav>
        <p class="no-results" id="no-results" role="status" hidden>No matching figures or notes.</p>
      </aside>
      <main id="content">
        <section class="section-heading" aria-labelledby="section-title">
          <p class="eyebrow" id="section-number"></p>
          <h2 id="section-title"></h2>
          <div class="legend" id="section-description"></div>
        </section>
        <div class="text-content" id="text-content" hidden>
          <div id="text-body"></div>
          <p class="text-source" id="text-source"><a id="source-link">Read the full source note</a></p>
        </div>
        <article id="figure-content" aria-labelledby="plot-title">
          <header class="figure-heading">
            <p class="figure-number" id="figure-number"></p>
            <h3 id="plot-title" tabindex="-1"></h3>
            <p class="plot-description" id="plot-description" hidden></p>
          </header>
          <div class="toolbar">
            <div class="pager" aria-label="Plot navigation">
              <button class="button" id="previous" aria-label="Previous plot" title="Previous plot">←</button>
              <button class="button" id="next" aria-label="Next plot" title="Next plot">→</button>
            </div>
            <button class="button" id="zoom" aria-pressed="false">Zoom labels</button>
            <div class="downloads" id="downloads" aria-label="Download figure"></div>
          </div>
          <div class="stage" id="stage" tabindex="0" role="region" aria-label="Figure preview; scroll when zoomed">
            <p class="image-status" id="image-status" role="status" hidden></p>
            <img id="figure-image" alt="">
          </div>
          <div class="download-panel" id="download-panel" hidden>
            <svg class="document-icon" viewBox="0 0 32 40" fill="none" aria-hidden="true">
              <path d="M6 1h13l11 11v26H2V1h4Z M19 1v12h11 M9 23h14 M9 29h10"
                stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
            </svg>
            <p class="download-note">This report is available as a PDF.</p>
            <a class="button primary" id="report-download" download>↓ Download PDF</a>
          </div>
          <p class="view-hint" id="view-hint">Use Zoom labels to inspect dense figures. Scroll within the preview to explore.</p>
        </article>
      </main>
    </div>
    <div class="sr-only" id="announcement" aria-live="polite"></div>
    <noscript><p>Enable JavaScript to browse this local figure library.</p></noscript>
  </div>
  <script id="gallery-data" type="application/json">@@GALLERY_DATA@@</script>
  <script>
    "use strict";
    const {sections} = JSON.parse(document.getElementById("gallery-data").textContent);
    const byId = id => document.getElementById(id);
    const entries = sections.flatMap(section => section.text
      ? [{id: section.id, title: section.title, description: section.description,
          text: section.text, section, isText: true}]
      : section.plots.map(plot => ({...plot, section, isText: false})));
    const plots = entries.filter(entry => !entry.isText);
    const lookup = new Map(entries.map(entry => [entry.id, entry]));
    const navLinks = new Map();
    const navSections = [];
    let activeId = null;
    let visibleEntries = entries;
    let visiblePlots = plots;
    byId("totals").textContent = `${sections.length} sections · ${plots.length} plots`;

    for (const section of sections) {
      if (section.text) {
        const link = makeNavLink(lookup.get(section.id));
        link.classList.add("text-link");
        link.setAttribute("aria-label", section.title);
        const label = document.createElement("span");
        label.className = "section-count";
        label.textContent = "Text";
        link.append(label);
        byId("navigation").append(link);
        navSections.push({group: link, count: null, section});
        continue;
      }
      const group = document.createElement("details");
      group.open = true;
      const summary = document.createElement("summary");
      const title = document.createElement("span");
      title.textContent = section.title;
      const count = document.createElement("span");
      count.className = "section-count";
      count.textContent = section.plots.length;
      summary.append(title, count);
      const list = document.createElement("div");
      list.className = "plot-list";
      for (const plot of section.plots) {
        list.append(makeNavLink(plot));
      }
      group.append(summary, list);
      byId("navigation").append(group);
      navSections.push({group, count, section});
    }

    function makeNavLink(entry) {
      const link = document.createElement("a");
      link.className = "plot-link";
      link.textContent = entry.title;
      link.href = `#${encodeURIComponent(entry.id)}`;
      link.addEventListener("click", event => {
        if (event.ctrlKey || event.metaKey || event.shiftKey || event.altKey) return;
        event.preventDefault();
        showEntry(entry.id, true);
      });
      navLinks.set(entry.id, link);
      return link;
    }

    function updatePager() {
      const index = visiblePlots.findIndex(plot => plot.id === activeId);
      byId("previous").disabled = index <= 0;
      byId("next").disabled = index < 0 || index >= visiblePlots.length - 1;
    }

    function renderParagraphs(container, text) {
      container.replaceChildren();
      for (const paragraph of text.split(/\n\s*\n/).filter(text => text.trim())) {
        const p = document.createElement("p");
        p.textContent = paragraph.replace(/\s*\n\s*/g, " ").trim();
        container.append(p);
      }
    }

    function showEntry(id, updateHash = false) {
      const entry = lookup.get(id);
      if (!entry) return;
      activeId = id;
      for (const [key, link] of navLinks) {
        if (key === id) {
          link.setAttribute("aria-current", "true");
          const group = link.closest("details");
          if (group) group.open = true;
        } else link.removeAttribute("aria-current");
      }
      byId("section-number").textContent = `Section ${sections.indexOf(entry.section) + 1}`;
      byId("section-title").textContent = entry.section.title;
      renderParagraphs(byId("section-description"), entry.section.description);
      byId("text-content").hidden = !entry.isText;
      byId("figure-content").hidden = entry.isText;
      if (entry.isText) {
        renderParagraphs(byId("text-body"), entry.text);
        byId("text-source").hidden = !entry.section.source;
        if (entry.section.source) {
          const sourceLink = byId("source-link");
          sourceLink.href = entry.section.source;
          sourceLink.textContent = entry.section.link_label || "Read the full source note";
          if (entry.section.download) sourceLink.setAttribute("download", "");
          else sourceLink.removeAttribute("download");
        }
      } else {
        showFigure(entry);
      }
      byId("announcement").textContent = entry.isText
        ? entry.title : `${entry.section.title}: ${entry.title}`;
      if (updateHash) location.hash = encodeURIComponent(id);
      updatePager();
    }

    function showFigure(plot) {
      const sectionIndex = plot.section.plots.findIndex(item => item.id === plot.id);
      byId("figure-number").textContent = `Plot ${sectionIndex + 1} of ${plot.section.plots.length}`;
      byId("plot-title").textContent = plot.title;
      byId("plot-description").textContent = plot.description;
      byId("plot-description").hidden = !plot.description;
      byId("stage").classList.remove("is-zoomed");
      byId("stage").scrollTop = byId("stage").scrollLeft = 0;
      byId("zoom").setAttribute("aria-pressed", "false");
      byId("zoom").textContent = "Zoom labels";
      byId("zoom").hidden = !plot.preview;
      byId("stage").hidden = !plot.preview;
      byId("view-hint").hidden = !plot.preview;
      byId("download-panel").hidden = !!plot.preview;
      byId("downloads").replaceChildren();
      const image = byId("figure-image");
      image.onload = image.onerror = null;
      image.removeAttribute("src");
      if (plot.preview) {
        image.hidden = true;
        byId("image-status").textContent = "Loading figure…";
        byId("image-status").hidden = false;
        image.onload = () => {
          image.hidden = false;
          byId("image-status").hidden = true;
        };
        image.onerror = () => {
          byId("image-status").textContent = "The preview could not be loaded. Keep the HTML beside its figure folders, or use a download link.";
          byId("image-status").hidden = false;
        };
        image.alt = plot.title;
        image.src = plot.preview;
        for (const file of plot.files) {
          const link = document.createElement("a");
          link.className = "button";
          link.textContent = `↓ ${file.format}`;
          link.setAttribute("aria-label", `Download ${file.format}: ${plot.title}`);
          link.href = file.url;
          link.download = "";
          byId("downloads").append(link);
        }
      } else {
        const pdf = plot.files.find(file => file.format === "PDF");
        byId("report-download").href = pdf.url;
      }
    }

    function readHash() {
      try { return decodeURIComponent(location.hash.slice(1)); }
      catch { return ""; }
    }

    function filterEntries() {
      const terms = byId("search").value.toLocaleLowerCase().trim().split(/\s+/).filter(Boolean);
      visibleEntries = entries.filter(entry => {
        const text = [entry.title, entry.description, entry.id, entry.section.title, entry.section.description, entry.text || ""]
          .join(" ").toLocaleLowerCase();
        return terms.every(term => text.includes(term));
      });
      visiblePlots = visibleEntries.filter(entry => !entry.isText);
      const visibleIds = new Set(visibleEntries.map(entry => entry.id));
      for (const [id, link] of navLinks) link.hidden = !visibleIds.has(id);
      for (const {group, count, section} of navSections) {
        const matches = section.text ? Number(visibleIds.has(section.id))
          : section.plots.filter(plot => visibleIds.has(plot.id)).length;
        group.hidden = matches === 0;
        if (count) count.textContent = matches;
        if (count && terms.length && matches) group.open = true;
      }
      byId("no-results").hidden = visibleEntries.length > 0;
      if (visibleEntries.length && !visibleIds.has(activeId)) showEntry(visibleEntries[0].id, true);
      updatePager();
    }

    byId("search").addEventListener("input", filterEntries);
    byId("previous").addEventListener("click", () => {
      const index = visiblePlots.findIndex(plot => plot.id === activeId);
      if (index > 0) showEntry(visiblePlots[index - 1].id, true);
    });
    byId("next").addEventListener("click", () => {
      const index = visiblePlots.findIndex(plot => plot.id === activeId);
      if (index >= 0 && index < visiblePlots.length - 1) showEntry(visiblePlots[index + 1].id, true);
    });
    byId("zoom").addEventListener("click", () => {
      const zoomed = byId("stage").classList.toggle("is-zoomed");
      byId("zoom").setAttribute("aria-pressed", String(zoomed));
      byId("zoom").textContent = zoomed ? "Fit width" : "Zoom labels";
    });
    window.addEventListener("hashchange", () => {
      const id = lookup.has(readHash()) ? readHash() : entries[0].id;
      if (id === activeId) return;
      if (!visibleEntries.some(entry => entry.id === id)) {
        byId("search").value = "";
        filterEntries();
      }
      showEntry(id);
    });
    showEntry(lookup.has(readHash()) ? readHash() : entries[0].id);
  </script>
</body>
</html>
